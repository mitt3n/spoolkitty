; Spoolman Kitty - ESP32 print agent
; https://docs.platformio.org/en/latest/projectconf/index.html
;
; Board: any ESP32 with BLE (ESP32, ESP32-C3, ESP32-S3). Not the ESP32-S2, which has no BLE.
; Pick the matching environment below, e.g.:
;   pio run -e esp32dev -t upload -t monitor
;
; Platform: the official platformio.org "espressif32" platform is still pinned
; to Arduino-ESP32 2.0.17 (IDF 4.4), but NimBLE-Arduino 2.x requires
; Arduino-ESP32 3.x. The community "pioarduino" fork tracks current
; Arduino-ESP32 releases, so we use that instead:
; https://github.com/pioarduino/platform-espressif32

[platformio]
default_envs = esp32dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@^2.2.1
board_build.partitions = huge_app.csv   ; the sketch is close to the default partition table's app-size limit
monitor_speed = 115200
upload_speed = 921600

[env:esp32dev]
board = esp32dev

[env:esp32-c3]
board = esp32-c3-devkitm-1

[env:esp32-s3]
board = esp32-s3-devkitc-1
